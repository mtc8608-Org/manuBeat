version: "3.9"

# DEV stack. Every published port binds to 127.0.0.1 on purpose: this file runs
# with example secrets (JWT_SECRET=replace-this…, ADMIN_PASSWORD=…), and on
# 0.0.0.0 any machine on the same network — café wifi, a shared office LAN —
# reaches the admin API, the unauthenticated python service and the MinIO
# console. To test the PWA from a phone, change only the pwa port back to
# 0.0.0.0 and only while you need it. Production uses docker-compose.prod.yml,
# which publishes nothing at all (Caddy reaches nodejs over the edge network).
services:
  # Python container
  python:
    build: ./python
    image: ${COMPOSE_PROJECT_NAME}_python
    container_name: ${COMPOSE_PROJECT_NAME}_python
    # No env_file: the compute service is unauthenticated and credential-free by
    # rule (.claude/rules/python-compute.md) — same as docker-compose.prod.yml.
    # It reads no environment variable, and handing it .env put JWT_SECRET,
    # SECRETS_MASTER_KEY and the DB/MinIO passwords one file-read away from any
    # subprocess endpoint it exposes.
    volumes:
      - ./python:/src
    ports:
      - 127.0.0.1:${PYTHON_PORT}:5000
    networks:
      - default
    command: ./api/watch
  # Nodejs container
  nodejs:
    build: ./nodejs
    image: ${COMPOSE_PROJECT_NAME}_nodejs
    container_name: ${COMPOSE_PROJECT_NAME}_nodejs
    env_file: .env
    volumes:
      - ./nodejs:/src
      - ./pwa/public:/public:ro
    ports:
      - 127.0.0.1:${NODE_PORT}:3000
    depends_on:
      postgres:
        condition: service_healthy
      python:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - default
      - db
    command: backend
  # PWA client container
  pwa:
    build: ./pwa
    tty: true
    stdin_open: true
    image: ${COMPOSE_PROJECT_NAME}_pwa
    container_name: ${COMPOSE_PROJECT_NAME}_pwa
    volumes:
      - ./pwa:/src
    networks:
      - default
    ports:
      - 127.0.0.1:${PWA_PORT}:8100 # pwa
      - 127.0.0.1:35729:35729 # livereload
      - 127.0.0.1:53703:53703 # websocket
    command: serve --external
  # MinIO object storage
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - .persist/minio:/data
    networks:
      - default
  # Postgres container
  postgres:
    image: postgres:16.2
    container_name: ${COMPOSE_PROJECT_NAME}_db
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_PORT: ${PG_PORT}
    networks:
      - db
    volumes:
      - .persist/db:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
  db:
    name: ${COMPOSE_PROJECT_NAME}-db
    external: false
