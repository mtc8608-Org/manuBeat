version: "3.9"

# DEV stack. Every published port binds to 127.0.0.1 on purpose: this file runs
# with example secrets (JWT_SECRET=replace-this…, ADMIN_PASSWORD=…), and on
# 0.0.0.0 any machine on the same network — café wifi, a shared office LAN —
# reaches the admin API, the unauthenticated python service and the MinIO
# console. To test the PWA from a phone, change only the pwa port back to
# 0.0.0.0 and only while you need it. Production uses docker-compose.prod.yml,
# which publishes nothing at all (Caddy reaches nodejs over the edge network).
services:
  # Python container
  python:
    build: ./python
    image: ${COMPOSE_PROJECT_NAME}_python
    container_name: ${COMPOSE_PROJECT_NAME}_python
    # No env_file: the compute service is unauthenticated, and handing it .env
    # put JWT_SECRET, SECRETS_MASTER_KEY, ADMIN_PASSWORD and the DB password one
    # file-read away from any endpoint it exposes.
    #
    # [MEDICAL] manuBeat deviates from upstream's fully credential-free compute
    # service by exactly these five variables: the cardio routes read and write
    # patient HDF5 files in MinIO directly (python/api/domains/medical/
    # cardio_routes.py). Listing them explicitly rather than restoring env_file
    # keeps every other secret out of the container. Moving that storage access
    # into the Node caller — the framework rule — would drop this block; until
    # then, never widen it.
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./python:/src
    ports:
      - 127.0.0.1:${PYTHON_PORT}:5000
    networks:
      - default
    command: ./api/watch
  # [MEDICAL] JupyterLab container — manuBeat-only, absent from upstream and from
  # docker-compose.prod.yml. It is the debugging surface over python/library: the
  # same bind mount as the python service, so notebooks import the exact library
  # the API runs and write their artefacts into python/notebookData/.
  #
  # No env_file and no environment block — a notebook is arbitrary code execution
  # by design, so it gets no credentials at all, not even the five MinIO variables
  # the API service carries. It reaches nothing but the source tree.
  #
  # Token auth is off because the port is bound to 127.0.0.1 like every other port
  # in this file. If you ever move it to 0.0.0.0, restore the token first.
  jupyter:
    build:
      context: ./python
      dockerfile: Dockerfile.notebook
    image: ${COMPOSE_PROJECT_NAME}_jupyter
    container_name: ${COMPOSE_PROJECT_NAME}_jupyter
    volumes:
      - ./python:/src
    ports:
      - 127.0.0.1:${JUPYTER_PORT}:8888
    networks:
      - default
    command: >
      jupyter lab --ip 0.0.0.0 --port 8888 --no-browser --allow-root
      --ServerApp.root_dir=/src --IdentityProvider.token=''
  # Nodejs container
  nodejs:
    build: ./nodejs
    image: ${COMPOSE_PROJECT_NAME}_nodejs
    container_name: ${COMPOSE_PROJECT_NAME}_nodejs
    env_file: .env
    volumes:
      - ./nodejs:/src
      - ./pwa/public:/public:ro
    ports:
      - 127.0.0.1:${NODE_PORT}:3000
    depends_on:
      postgres:
        condition: service_healthy
      python:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - default
      - db
    command: backend
  # PWA client container
  pwa:
    build: ./pwa
    tty: true
    stdin_open: true
    image: ${COMPOSE_PROJECT_NAME}_pwa
    container_name: ${COMPOSE_PROJECT_NAME}_pwa
    volumes:
      - ./pwa:/src
    networks:
      - default
    ports:
      - 127.0.0.1:${PWA_PORT}:8100 # pwa
      - 127.0.0.1:35729:35729 # livereload
      - 127.0.0.1:53703:53703 # websocket
    command: serve --external
  # MinIO object storage
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - .persist/minio:/data
    networks:
      - default
  # Postgres container
  postgres:
    image: postgres:16.2
    container_name: ${COMPOSE_PROJECT_NAME}_db
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_PORT: ${PG_PORT}
    networks:
      - db
    volumes:
      - .persist/db:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
  db:
    name: ${COMPOSE_PROJECT_NAME}-db
    external: false
