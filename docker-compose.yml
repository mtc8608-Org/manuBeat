version: "3.9"

# DEV stack. Every published port binds to 127.0.0.1 on purpose: this file runs
# with example secrets (JWT_SECRET=replace-this…, ADMIN_PASSWORD=…), and on
# 0.0.0.0 any machine on the same network — café wifi, a shared office LAN —
# reaches the admin API, the unauthenticated python service and the MinIO
# console. To test the PWA from a phone, change only the pwa port back to
# 0.0.0.0 and only while you need it. Production uses docker-compose.prod.yml,
# which publishes nothing at all (Caddy reaches nodejs over the edge network).
services:
  # Python container
  python:
    build: ./python
    image: ${COMPOSE_PROJECT_NAME}_python
    container_name: ${COMPOSE_PROJECT_NAME}_python
    # No env_file: the compute service is unauthenticated, and handing it .env
    # put JWT_SECRET, SECRETS_MASTER_KEY, ADMIN_PASSWORD and the DB password one
    # file-read away from any endpoint it exposes.
    #
    # [MEDICAL] manuBeat deviates from upstream's fully credential-free compute
    # service by exactly these five variables: the cardio routes read and write
    # patient HDF5 files in MinIO directly (python/api/domains/medical/
    # cardio_routes.py). Listing them explicitly rather than restoring env_file
    # keeps every other secret out of the container. Moving that storage access
    # into the Node caller — the framework rule — would drop this block; until
    # then, never widen it.
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # [MEDICAL] jax.config.update("jax_enable_x64", ...) and the CPU platform pin
      # have to happen BEFORE jax is imported; the API service imports the model stack
      # at module load, so it has no moment to do that in code — the env vars are the
      # only hook. Without x64 a run is float32,
      # where the gap between representable numbers at cpet's start time (T = 45,060 s) is
      # 0.0039 — 16x the 0.00025 timestep — so the model's time state cannot advance, every
      # saved sample carries the same timestamp, and every plot collapses onto one x.
      # GPU stays off by policy (benchmarked 1.7-2.7x SLOWER for this workload), matching
      # the jax[cpu] install.
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: "cpu"
    volumes:
      - ./python:/src
    ports:
      - 127.0.0.1:${PYTHON_PORT}:5000
    networks:
      - default
    command: ./api/watch
  # Nodejs container
  nodejs:
    build: ./nodejs
    image: ${COMPOSE_PROJECT_NAME}_nodejs
    container_name: ${COMPOSE_PROJECT_NAME}_nodejs
    env_file: .env
    volumes:
      - ./nodejs:/src
      - ./pwa/public:/public:ro
    ports:
      - 127.0.0.1:${NODE_PORT}:3000
    depends_on:
      postgres:
        condition: service_healthy
      python:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - default
      - db
    command: backend
  # PWA client container
  pwa:
    build: ./pwa
    tty: true
    stdin_open: true
    image: ${COMPOSE_PROJECT_NAME}_pwa
    container_name: ${COMPOSE_PROJECT_NAME}_pwa
    volumes:
      - ./pwa:/src
    networks:
      - default
    ports:
      - 127.0.0.1:${PWA_PORT}:8100 # pwa
      - 127.0.0.1:35729:35729 # livereload
      - 127.0.0.1:53703:53703 # websocket
    command: serve --external
  # MinIO object storage
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    # Host side moved off 9000/9001 — those two are heavily contested on a dev box
    # (any other MinIO, and plenty of local servers and dev tools grab them).
    # Only the LEFT number changes: inside the docker network MinIO still serves S3
    # on 9000 and its console on 9001, which is what MINIO_PORT=9000 in .env means
    # and what the Node and Python clients dial. Never "fix" a collision by editing
    # MINIO_PORT — that aims the clients at the console, which does not speak S3.
    # Console is at http://localhost:9101. Production publishes nothing at all
    # (docker-compose.prod.yml), so this is dev-only and never ships.
    ports:
      - 127.0.0.1:9100:9000   # S3 API
      - 127.0.0.1:9101:9001   # web console
    volumes:
      - .persist/minio:/data
    networks:
      - default
  # Postgres container
  postgres:
    image: postgres:16.2
    container_name: ${COMPOSE_PROJECT_NAME}_db
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_PORT: ${PG_PORT}
    networks:
      - db
    volumes:
      - .persist/db:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
  db:
    name: ${COMPOSE_PROJECT_NAME}-db
    external: false
